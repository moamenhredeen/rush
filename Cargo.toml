[package]
name = "rush"
version = "0.1.0"
edition = "2024"

[dependencies]
ctrlc = "3.5.2"
glob = "0.3.3"
libc = "0.2.186"
nu-ansi-term = "0.50.3"
os_pipe = "1.2.3"
reedline = "0.48.0"
uu_cat = "0.9.0"
uu_cp = "0.9.0"
uu_echo = "0.9.0"
uu_ls = "0.9.0"
uu_mkdir = "0.9.0"
uu_mv = "0.9.0"
uu_pwd = "0.9.0"
uu_rm = "0.9.0"
uu_sort = "0.9.0"
uu_touch = "0.9.0"
uu_uniq = "0.9.0"
uu_wc = "0.9.0"
uucore = "0.9.0"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3.27.0"
